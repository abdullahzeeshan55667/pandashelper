[project]
name = "python-teaching-companion"
version = "0.1.0"
description = "Concise Python teaching docs with LLM-friendly session tooling"
authors = [{name = "Learner-Friendly Docs"}]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "matplotlib>=3.8"
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = ""}
